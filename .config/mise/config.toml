"github:pystardust/ani-cli" = "5.1"
"github:rilldata/rill" = "0.91.3"

"http:amp" = { version = "0.0.1795608053-gcec25c", url = "https://static.ampcode.com/cli/{{ version }}/amp-darwin-arm64", checksum_url = "https://static.ampcode.com/cli/{{ version }}/darwin-arm64-amp.sha256", version_list_url = "https://static.ampcode.com/cli/cli-version.txt" }

