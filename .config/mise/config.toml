typst = "latest"
vale = "latest"
vendir = "latest"
yq = "latest"
yt-dlp = "latest"
zig = "latest"
zls = "latest"
zoxide = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
python.uv_venv_auto = true

