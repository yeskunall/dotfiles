"brew-cask:1password" = { version = "latest", os = "macos" }
"brew-cask:1password-cli" = { version = "latest", os = "macos" }
"brew-cask:beeper" = { version = "latest", os = "macos" }
"brew-cask:blender" = { version = "latest", os = "macos" }
"brew-cask:brave-browser@nightly" = { version = "latest", os = "macos" }
"brew-cask:font-commit-mono-nerd-font" = { version = "latest", os = "macos" }
"brew-cask:font-sf-mono-nerd-font-ligaturized" = { version = "latest", os = "macos" }
"brew-cask:knockknock" = { version = "latest", os = "macos" }
"brew-cask:localsend" = { version = "latest", os = "macos" }
"brew-cask:raycast" = { version = "latest", os = "macos" }
"brew-cask:session-manager-plugin" = { version = "latest", os = "macos" }
"brew-cask:puremac" = { version = "latest", os = "macos" }

# Docker only finds CLI plugins in its config directory (`~/.docker/cli-plugins`
# by default), not PATH or the Homebrew prefix, so link the installed plugins
# there.
[bootstrap.hooks.post-packages]
run = '''
for plugin in docker-buildx docker-compose; do
  if root=$(mise bootstrap packages where "brew:$plugin"); then
    src="$root/lib/docker/cli-plugins/$plugin"
    if [ -f "$src" ]; then
      config_dir="${DOCKER_CONFIG:-$HOME/.docker}"
      mkdir -p "$config_dir/cli-plugins"
      dest="$config_dir/cli-plugins/$plugin"
      if [ -L "$dest" ]; then
        if [ "$(readlink "$dest")" = "$src" ]; then
          continue
        fi
        echo "mise: $dest points elsewhere; not replacing it" >&2
        continue
      fi
      if [ -e "$dest" ]; then
        if [ -e "$dest.bak" ]; then
          echo "mise: $dest.bak exists; not replacing it" >&2
          continue
        fi
        mv "$dest" "$dest.bak"
      fi
      ln -sfn "$src" "$dest"
    fi
  fi
done
'''
