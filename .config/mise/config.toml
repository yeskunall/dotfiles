[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
minimum_release_age = "7d"
minimum_release_age_excludes = ["http:amp"] # the `http` backend publishes no release dates
python.uv_venv_auto = true
self_update.auto = true
self_update.minimum_release_age = "0s"

