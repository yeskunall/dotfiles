[tool_alias]
fff-mcp = "github:dmtrKovalenko/fff"
ipinfo-cli = "github:ipinfo/cli"

[tools]
# Runtimes
node = "24.20.0"
go = "1.26.6"
ruby = "3.4.3"
python = ["3.14.6", "3.12"]
uv = "0.11.28"
rumdl = "latest"
lychee = "latest"

# Developer tools
act = "latest"
ansible = "latest"
aws-cli = "latest"
aws-vault = "latest"
bat = "latest"
bun = "latest"
"npm:cfonts" = "latest"
cmake = "latest"
"github:composer/composer" = { version = "latest", bin = "composer" }
"pipx:csvkit" = "latest"
deno = "latest"
dive = "latest"
docker-cli = "latest"
dprint = "latest"
duf = "latest"
exiftool = "latest"
"vfox:jdx/vfox-eza" = "latest"
fd = "latest"
fff-mcp = { version = "latest", matching = "fff-mcp-", bin = "fff-mcp" }
flyctl = "latest"
"pipx:fonttools" = "latest"
fx = "latest"
fzf = "latest"
github-cli = "latest"
git-filter-repo = "latest"
git-town = "latest"
glow = "latest"
golangci-lint = "latest"
gum = "latest"
helix = "latest"
htmlq = "latest"
hunk = "latest"
"pipx:httpie" = "latest"
hugo = "latest"
"github:icann/icann-rdap" = "latest"
ipinfo-cli = { version = "latest", version_prefix = "ipinfo-", matching = "ipinfo_", rename_exe = { "ipinfo_*" = "ipinfo" } }
lazydocker = "latest"
lazygit = "latest"
libsql-server = "latest"
"aqua:neilotoole/sq" = "latest"
"aqua:neovim/neovim" = "latest"
opencode = "latest"
pandoc = "latest"
pipx = "latest"
"github:natesales/q" = "latest"
qsv = "latest"
rclone = "latest"
"github:rilldata/rill" = "latest"
ripgrep = "latest"
"pipx:streamlink" = "latest"
"npm:@tigrisdata/cli" = "latest"
