[tool_alias]
ipinfo-cli = "github:ipinfo/cli"

[tools]
# Runtimes
node = "24.22.0"
go = "1.27.3"
ruby = "3.4.3"
python = ["3.14.6", "3.12.15"]
uv = "0.13.4"
rumdl = "0.2.79"
lychee = "0.24.2"

# Developer tools
act = "0.2.89"
ansible = "14.5.0"
aws-cli = "2.38.0"
bat = "0.26.1"
bun = "1.4.3"
cmake = "4.4.4"
"pipx:csvkit" = "2.2.0"
dive = "0.13.1"
docker-cli = "29.9.0"
dprint = "0.63.0"
duf = "0.9.1"
exiftool = "13.59"
"vfox:jdx/vfox-eza" = "0.23.5"
fd = "10.5.0"
flyctl = "0.4.117"
"pipx:fonttools" = "4.66.1"
fx = "40.0.0"
fzf = "0.74.5"
github-cli = "2.102.0"
git-filter-repo = "2.47.0"
git-town = "24.1.0"
glow = "3.0.0"
golangci-lint = "2.14.0"
gum = "2.0.2"
helix = "25.07.1"
htmlq = "0.4.0"
hunk = "0.23.0"
"pipx:httpie" = "3.2.4"
"github:icann/icann-rdap" = "1.0.1"
ipinfo-cli = { version = "3.3.2", version_prefix = "ipinfo-", matching = "ipinfo_", rename_exe = { "ipinfo_*" = "ipinfo" } }
lazydocker = "0.25.2"
lazygit = "0.66.1"
"aqua:neilotoole/sq" = "0.55.0"
"aqua:neovim/neovim" = "0.12.6"
pandoc = "3.12.1"
pipx = "1.17.14"
"github:natesales/q" = "0.19.12"
qsv = "24.0.0"
rclone = "1.75.2"
"github:rilldata/rill" = "0.90.5"
ripgrep = "15.2.0"
"pipx:streamlink" = "8.6.2"
"npm:@tigrisdata/cli" = "3.17.0"
typst = "0.15.1"
vale = "3.24.0"
vendir = "0.46.2"
yq = "4.54.1"
yt-dlp = "2026.08.19"
zig = "0.17.0"
zls = "0.17.0"
zoxide = "0.10.0"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
minimum_release_age = "7d"
python.uv_venv_auto = true
self_update.auto = true
self_update.minimum_release_age = "0s"

[bootstrap.packages]
# Shared libraries, services, and host-integrated formulae
"brew:aria2" = "latest"
"brew:autoconf" = "latest"
"brew:cairo" = "latest"
"brew:colima" = "latest"
"brew:docker-buildx" = "latest"
