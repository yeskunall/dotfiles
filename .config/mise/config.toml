"brew:imagemagick" = "latest"
"brew:jpeg-xl" = "latest"
"brew:libtiff" = "latest"
"brew:libyaml" = "latest"
"brew:lld" = "latest"
"brew:lmdb" = "latest"
"brew:macos-trash" = "latest"
"brew:mdbtools" = "latest"
"brew:mysql" = "latest"
"brew:nmap" = "latest"
"brew:openssl@3" = "latest"
"brew:postgresql@17" = "latest"
"brew:qemu" = "latest"
